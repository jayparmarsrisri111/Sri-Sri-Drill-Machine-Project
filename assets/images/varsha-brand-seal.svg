<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <filter id="stamp-rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="circlePathTop" d="M 28 110 A 82 82 0 0 1 192 110" />
    <path id="circlePathBottom" d="M 192 110 A 82 82 0 0 1 28 110" />
  </defs>
  <!-- Stamp rotated slightly by -6 degrees for natural stamping look -->
  <g transform="rotate(-6 110 110)" filter="url(#stamp-rough)" stroke="#7c3aed" fill="#7c3aed" opacity="0.88">
    <!-- Double Circular Border -->
    <circle cx="110" cy="110" r="100" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-dasharray="1200" />
    <circle cx="110" cy="110" r="92" fill="none" stroke="#7c3aed" stroke-width="1.5" />
    <circle cx="110" cy="110" r="66" fill="none" stroke="#7c3aed" stroke-width="2" />
    
    <!-- Text along path -->
    <text font-family="'Space Grotesk', Impact, sans-serif" font-size="12.5" font-weight="800" letter-spacing="2.8" fill="#7c3aed">
      <textPath href="#circlePathTop" startOffset="50%" text-anchor="middle">
        ★ VARSHA BRAND ★
      </textPath>
    </text>
    <text font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#7c3aed">
      <textPath href="#circlePathBottom" startOffset="50%" text-anchor="middle">
        • SHREE VARSHA ENG. RAJKOT •
      </textPath>
    </text>
    
    <!-- Center Content -->
    <!-- Gear outline in center -->
    <circle cx="110" cy="110" r="32" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="110" y="98" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">
      APPROVED
    </text>
    <line x1="80" y1="104" x2="140" y2="104" stroke="#7c3aed" stroke-width="1.8" />
    <text x="110" y="118" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.2">
      QUALITY CHECK
    </text>
    <text x="110" y="132" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">
      ISO 9001:2015
    </text>
    
    <!-- Stars -->
    <polygon points="110,68 112,74 118,74 113,78 115,84 110,80 105,84 107,78 102,74 108,74" fill="#7c3aed"/>
    <polygon points="110,140 112,146 118,146 113,150 115,156 110,152 105,156 107,150 102,146 108,146" fill="#7c3aed"/>
  </g>
</svg>
