<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pd32Col" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" rx="16" fill="#090d16"/>
  <rect x="10" y="10" width="480" height="430" rx="12" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="25" y="25" width="130" height="26" rx="6" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="1"/>
  <text x="90" y="42" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#00e5ff" text-anchor="middle">SVEW-PD-32</text>
  <text x="475" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#38bdf8" text-anchor="end">GEARED PILLAR (32 MM)</text>

  <!-- Heavy Base -->
  <rect x="150" y="375" width="200" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="140" y="403" width="220" height="15" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <line x1="165" y1="388" x2="335" y2="388" stroke="#38bdf8" stroke-width="2"/>

  <!-- Column Flange -->
  <rect x="215" y="340" width="70" height="35" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <rect x="225" y="90" width="50" height="250" fill="url(#pd32Col)" stroke="#334155" stroke-width="1.5"/>

  <!-- Adjustable Table with Rotatable Arm -->
  <rect x="215" y="235" width="70" height="45" rx="5" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5"/>
  <rect x="140" y="222" width="160" height="16" rx="2" fill="url(#pd32Col)" stroke="#64748b" stroke-width="1"/>
  <line x1="150" y1="230" x2="290" y2="230" stroke="#0f172a" stroke-width="2.5"/>

  <!-- All-Geared Head Body -->
  <rect x="180" y="60" width="150" height="85" rx="7" fill="#0b1120" stroke="#00e5ff" stroke-width="2"/>
  <!-- Gear Selection Levers -->
  <circle cx="215" cy="90" r="7" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="255" cy="90" r="7" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Rear Flange Motor -->
  <rect x="275" y="30" width="55" height="45" rx="4" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1"/>

  <!-- Spindle & Star Feed Handle -->
  <rect x="190" y="145" width="26" height="50" fill="url(#pd32Col)" stroke="#475569" stroke-width="1.5"/>
  <circle cx="160" cy="105" r="9" fill="#475569"/>
  <line x1="160" y1="80" x2="160" y2="130" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="135" y1="105" x2="185" y2="105" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Chuck & Bit -->
  <rect x="194" y="195" width="18" height="18" fill="#334155" stroke="#00e5ff" stroke-width="1.5"/>
  <path d="M199 213 L207 213 L204 235 L203 240 L202 235 Z" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
</svg>
