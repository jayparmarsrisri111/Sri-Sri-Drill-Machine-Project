<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bodyDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="steelCol" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background plate -->
  <rect width="500" height="450" rx="16" fill="#0b1120"/>
  <rect x="10" y="10" width="480" height="430" rx="12" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5"/>

  <!-- Machine Model Header Tag -->
  <rect x="25" y="25" width="125" height="26" rx="6" fill="rgba(14, 165, 233, 0.15)" stroke="#0284c7" stroke-width="1"/>
  <text x="87" y="42" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">SVEW-RD-40</text>
  
  <text x="475" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="end">CAPACITY: 40 MM</text>

  <!-- Machinery Drawing -->
  <!-- Base Plate -->
  <path d="M80 380 L420 380 L440 405 L60 405 Z" fill="url(#bodyDark)" stroke="#475569" stroke-width="1.5"/>
  <rect x="80" y="365" width="340" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <line x1="160" y1="375" x2="400" y2="375" stroke="#00f0ff" stroke-width="2"/>

  <!-- Column Base & Column -->
  <rect x="105" y="325" width="70" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="115" y="85" width="50" height="245" fill="url(#steelCol)" stroke="#334155" stroke-width="1"/>
  
  <!-- Arm Elevating Gear Top -->
  <path d="M105 85 L175 85 L165 65 L115 65 Z" fill="#334155"/>
  <rect x="125" y="45" width="30" height="20" rx="3" fill="#0284c7"/>

  <!-- Box Table -->
  <rect x="270" y="295" width="130" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="260" y="285" width="150" height="12" rx="2" fill="url(#steelCol)" stroke="#64748b" stroke-width="1"/>
  <line x1="270" y1="291" x2="400" y2="291" stroke="#0f172a" stroke-width="2"/>

  <!-- Radial Arm Sleeve -->
  <rect x="102" y="140" width="76" height="85" rx="5" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5"/>
  
  <!-- Radial Arm Body -->
  <path d="M175 145 L420 160 L420 200 L175 210 Z" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="180" y="165" width="235" height="10" fill="url(#steelCol)"/>

  <!-- Drill Headstock -->
  <g transform="translate(290, 125)">
    <rect x="0" y="0" width="95" height="100" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Motor on top -->
    <rect x="20" y="-35" width="55" height="36" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <!-- Head Controls -->
    <circle cx="25" cy="35" r="7" fill="#334155" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="70" cy="35" r="7" fill="#334155" stroke="#f59e0b" stroke-width="1"/>
    <!-- Star Feed Wheel -->
    <circle cx="48" cy="65" r="9" fill="#475569"/>
    <line x1="48" y1="45" x2="48" y2="85" stroke="#cbd5e1" stroke-width="2.5"/>
    <line x1="28" y1="65" x2="68" y2="65" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="48" cy="45" r="2.5" fill="#f59e0b"/>
    <circle cx="48" cy="85" r="2.5" fill="#f59e0b"/>
    <circle cx="28" cy="65" r="2.5" fill="#f59e0b"/>
    <circle cx="68" cy="65" r="2.5" fill="#f59e0b"/>
    <!-- Spindle Quill -->
    <rect x="36" y="100" width="24" height="45" fill="url(#steelCol)" stroke="#334155" stroke-width="1"/>
    <!-- Chuck & Drill bit -->
    <rect x="40" y="145" width="16" height="15" fill="#334155"/>
    <path d="M45 160 L51 160 L49 195 L48 205 L47 195 Z" fill="#f59e0b"/>
  </g>
</svg>
