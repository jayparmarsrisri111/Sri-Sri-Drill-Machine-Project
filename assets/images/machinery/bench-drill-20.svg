<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bdCol" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" rx="16" fill="#090d16"/>
  <rect x="10" y="10" width="480" height="430" rx="12" fill="none" stroke="rgba(14, 165, 233, 0.2)" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="25" y="25" width="130" height="26" rx="6" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="90" y="42" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">SVEW-BD-20</text>
  <text x="475" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="end">BENCH DRILL (20 MM)</text>

  <!-- Heavy Cast Bench Base -->
  <rect x="150" y="340" width="200" height="35" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <line x1="170" y1="355" x2="330" y2="355" stroke="#00f0ff" stroke-width="2"/>
  <!-- Base Mounting Bolt Holes -->
  <circle cx="165" cy="358" r="4" fill="#64748b"/>
  <circle cx="335" cy="358" r="4" fill="#64748b"/>

  <!-- Compact Sturdy Column -->
  <rect x="235" y="120" width="36" height="220" fill="url(#bdCol)" stroke="#334155" stroke-width="1"/>

  <!-- Compact Swivel Table -->
  <rect x="225" y="250" width="55" height="30" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <rect x="165" y="240" width="115" height="12" rx="2" fill="url(#bdCol)" stroke="#64748b" stroke-width="1"/>

  <!-- High Speed Bench Head -->
  <rect x="190" y="90" width="135" height="70" rx="6" fill="#0f172a" stroke="#00e5ff" stroke-width="1.5"/>
  <!-- Top Belt Pulley Cover -->
  <path d="M185 90 L330 90 L320 68 L195 68 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Rear Motor -->
  <rect x="270" y="60" width="45" height="45" rx="4" fill="#0284c7"/>

  <!-- High Speed Spindle & 3-Spoke Feed Handle -->
  <rect x="200" y="160" width="18" height="40" fill="url(#bdCol)" stroke="#475569" stroke-width="1"/>
  <circle cx="178" cy="125" r="7" fill="#475569"/>
  <line x1="178" y1="108" x2="178" y2="142" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="161" y1="125" x2="195" y2="125" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Keyless Drill Chuck & Precision Drill Bit -->
  <rect x="202" y="200" width="14" height="15" fill="#334155" stroke="#00e5ff" stroke-width="1"/>
  <path d="M206 215 L212 215 L210 230 L209 234 L208 230 Z" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
</svg>
