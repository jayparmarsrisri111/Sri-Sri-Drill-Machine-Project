    <path d="M 132 50 C 138 45 145 44 146 50 C 148 55 142 58 138 58 C 135 58 134 54 136 49 C 138 44 145 46 150 48 C 156 50 162 48 166 45 C 170 42 174 46 176 50 C 180 43 186 42 191 46 C 196 50 200 44 205 45 C 210 46 215 54 220 48" />
