<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="100%" height="100%">
  <defs>
    <!-- Machinery Cast Iron Gradients -->
    <linearGradient id="castIronDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="castIronBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#0f2b66"/>
      <stop offset="100%" stop-color="#0a1936"/>
    </linearGradient>

    <linearGradient id="steelColumn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="neonHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Technical Background Grid & Concentric Measure Circles -->
  <g opacity="0.25">
    <circle cx="350" cy="300" r="280" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,8"/>
    <circle cx="350" cy="300" r="200" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,6"/>
    <line x1="50" y1="300" x2="650" y2="300" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="350" y1="50" x2="350" y2="550" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5,5"/>
    <rect x="70" y="70" width="560" height="460" rx="10" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="350" cy="545" rx="260" ry="25" fill="#000000" opacity="0.65" filter="url(#shadowFilter)"/>

  <!-- ==================== RADIAL DRILL MACHINE ==================== -->
  
  <!-- 1. HEAVY BASE PLATE WITH T-SLOTS -->
  <g id="machine-base">
    <!-- Bottom Base Plinth -->
    <path d="M120 500 L580 500 L610 540 L90 540 Z" fill="url(#castIronDark)" stroke="#475569" stroke-width="2"/>
    <rect x="120" y="470" width="460" height="32" rx="4" fill="url(#castIronBody)" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- T-Slots on Base Plate -->
    <rect x="220" y="475" width="340" height="7" fill="#0b1120" stroke="#64748b" stroke-width="1"/>
    <rect x="220" y="488" width="340" height="7" fill="#0b1120" stroke="#64748b" stroke-width="1"/>
    <!-- Coolant Sump & Drain Trough -->
    <path d="M100 535 L600 535 L605 540 L95 540 Z" fill="#00f0ff" opacity="0.3"/>
  </g>

  <!-- 2. HEAVY CYLINDRICAL GROUND COLUMN (Solid Cast Iron / Steel) -->
  <g id="machine-column">
    <!-- Column Base Flange -->
    <rect x="150" y="430" width="100" height="42" rx="6" fill="url(#castIronDark)" stroke="#475569" stroke-width="2"/>
    <!-- Heavy Column Bolts -->
    <circle cx="165" cy="450" r="4.5" fill="#94a3b8"/>
    <circle cx="235" cy="450" r="4.5" fill="#94a3b8"/>
    <!-- Main Ground Column Shaft -->
    <rect x="160" y="80" width="80" height="352" fill="url(#steelColumn)" stroke="#334155" stroke-width="1.5"/>
    <!-- Column Top Cap with Arm Elevating Motor -->
    <path d="M150 78 L250 78 L240 50 L160 50 Z" fill="url(#castIronDark)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Elevating Motor on Top of Column -->
    <rect x="175" y="20" width="50" height="32" rx="4" fill="url(#castIronBody)" stroke="#3b82f6" stroke-width="1"/>
    <!-- Motor Cooling Fins -->
    <line x1="180" y1="24" x2="180" y2="48" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="190" y1="24" x2="190" y2="48" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="200" y1="24" x2="200" y2="48" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="210" y1="24" x2="210" y2="48" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="220" y1="24" x2="220" y2="48" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- 3. HEAVY BOX TABLE (Removable, Mounted on Base) -->
  <g id="work-table">
    <rect x="360" y="380" width="180" height="92" rx="4" fill="url(#castIronDark)" stroke="#475569" stroke-width="2"/>
    <rect x="350" y="365" width="200" height="18" rx="2" fill="url(#steelColumn)" stroke="#64748b" stroke-width="1.5"/>
    <!-- T-slots on Top Table Surface -->
    <line x1="360" y1="373" x2="540" y2="373" stroke="#0f172a" stroke-width="3"/>
    <!-- Side T-slots -->
    <line x1="380" y1="410" x2="520" y2="410" stroke="#0f172a" stroke-width="4"/>
    <line x1="380" y1="435" x2="520" y2="435" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- 4. RADIAL ARM (Moves up/down and swivels 360°) -->
  <g id="radial-arm">
    <!-- Arm Sleeve that clamps on the Column -->
    <rect x="145" y="160" width="110" height="120" rx="6" fill="url(#castIronBody)" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="160" cy="190" r="5" fill="#f59e0b"/>
    <circle cx="160" cy="250" r="5" fill="#f59e0b"/>
    
    <!-- Arm Body Extending Horizontally -->
    <path d="M250 170 L590 185 L590 240 L250 255 Z" fill="url(#castIronBody)" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Precision Guideway Rails on Arm -->
    <rect x="255" y="195" width="330" height="12" fill="url(#steelColumn)" stroke="#475569" stroke-width="1"/>
    <rect x="255" y="215" width="330" height="12" fill="url(#steelColumn)" stroke="#475569" stroke-width="1"/>
    
    <!-- Heavy Elevating Screw Shaft (behind arm) -->
    <line x1="235" y1="80" x2="235" y2="430" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2,2"/>
  </g>

  <!-- 5. DRILLING HEADSTOCK (Traverses along the arm) -->
  <g id="drill-head" transform="translate(400, 140)">
    <!-- Headstock Main Housing -->
    <rect x="0" y="0" width="130" height="145" rx="8" fill="url(#castIronDark)" stroke="#00f0ff" stroke-width="2" filter="url(#shadowFilter)"/>
    
    <!-- Gearbox Cover with Brand Plate -->
    <rect x="10" y="10" width="110" height="40" rx="4" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="65" y="28" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#00f0ff" text-anchor="middle">SVEW • RAJKOT</text>
    <text x="65" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#fbbf24" text-anchor="middle">RD-40 ALL-GEARED</text>

    <!-- Speed & Feed Gear Selector Levers -->
    <circle cx="30" cy="75" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="30" y1="75" x2="20" y2="60" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="60" r="4" fill="#ef4444"/>

    <circle cx="100" cy="75" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="100" y1="75" x2="110" y2="60" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="110" cy="60" r="4" fill="#ef4444"/>

    <!-- Manual Feed Star Wheel / Capstan Handle -->
    <circle cx="65" cy="105" r="12" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="65" y1="80" x2="65" y2="130" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="40" y1="105" x2="90" y2="105" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="65" cy="80" r="3.5" fill="#f59e0b"/>
    <circle cx="65" cy="130" r="3.5" fill="#f59e0b"/>
    <circle cx="40" cy="105" r="3.5" fill="#f59e0b"/>
    <circle cx="90" cy="105" r="3.5" fill="#f59e0b"/>

    <!-- Top Main Spindle Drive Motor -->
    <rect x="25" y="-60" width="80" height="62" rx="6" fill="url(#castIronBody)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="35" y="-70" width="60" height="12" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    
    <!-- Spindle Quill & Sleeve (Extending downward) -->
    <rect x="47" y="145" width="36" height="75" fill="url(#steelColumn)" stroke="#475569" stroke-width="1.5"/>
    <!-- Quill Measurement Scale -->
    <line x1="53" y1="155" x2="59" y2="155" stroke="#0f172a" stroke-width="1"/>
    <line x1="53" y1="165" x2="63" y2="165" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="53" y1="175" x2="59" y2="175" stroke="#0f172a" stroke-width="1"/>
    <line x1="53" y1="185" x2="63" y2="185" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="53" y1="195" x2="59" y2="195" stroke="#0f172a" stroke-width="1"/>
    <line x1="53" y1="205" x2="63" y2="205" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Morse Taper Spindle Nose (MT-4) -->
    <path d="M51 220 L79 220 L75 240 L55 240 Z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>

    <!-- Drill Chuck / Tool Arbor -->
    <rect x="53" y="240" width="24" height="25" rx="2" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="55" y1="248" x2="75" y2="248" stroke="#475569" stroke-width="1"/>
    <line x1="55" y1="256" x2="75" y2="256" stroke="#475569" stroke-width="1"/>

    <!-- Drill Bit (Hardened Spiral Flutes) -->
    <path d="M60 265 L70 265 L68 300 L65 315 L62 300 Z" fill="url(#amberAccent)" stroke="#78350f" stroke-width="1"/>
    <line x1="62" y1="275" x2="68" y2="282" stroke="#ffffff" stroke-width="1"/>
    <line x1="62" y1="290" x2="68" y2="297" stroke="#ffffff" stroke-width="1"/>

    <!-- Drilling Cutting Chips & Spark Glow (High tech dynamic feel) -->
    <circle cx="65" cy="316" r="4" fill="#00f0ff" filter="url(#glowEffect)"/>
    <circle cx="61" cy="312" r="1.5" fill="#fef08a"/>
    <circle cx="69" cy="314" r="1.5" fill="#fef08a"/>
    <circle cx="64" cy="322" r="2" fill="#00f0ff"/>
  </g>

  <!-- Technical Spec Callout Overlays (Siqol-style technical labels) -->
  <g font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">
    <!-- Callout 1: Hardened Column -->
    <line x1="120" y1="120" x2="165" y2="150" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="120" cy="120" r="3" fill="#00f0ff"/>
    <rect x="20" y="105" width="105" height="28" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#00f0ff" stroke-width="1"/>
    <text x="72" y="123" fill="#e2e8f0" text-anchor="middle">Ø 210mm Column</text>

    <!-- Callout 2: All-Geared Head -->
    <line x1="570" y1="110" x2="520" y2="150" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="570" cy="110" r="3" fill="#00f0ff"/>
    <rect x="560" y="95" width="115" height="28" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#00f0ff" stroke-width="1"/>
    <text x="617" y="113" fill="#00f0ff" text-anchor="middle">8-Speed Geared Head</text>

    <!-- Callout 3: 40mm Capacity -->
    <line x1="570" y1="410" x2="500" y2="445" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="570" cy="410" r="3" fill="#f59e0b"/>
    <rect x="560" y="395" width="120" height="28" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#f59e0b" stroke-width="1"/>
    <text x="620" y="413" fill="#f59e0b" text-anchor="middle">Heavy T-Slot Box Table</text>
  </g>
</svg>
